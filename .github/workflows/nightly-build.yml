# AXIOM verified weekly integration
name: AXIOM verified weekly build and release

on:
  # GitHub schedules are evaluated from the repository default branch (main).
  # Weekly on Monday early morning in Australia/Sydney (Sunday 16:17 UTC).
  # Run manually from Actions for an immediate build.
  schedule:
    - cron: "17 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axiom-verified-weekly-release
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    name: Merge main + development, verify, prepare nightly branch
    runs-on: ubuntu-latest
    outputs:
      package_tag: ${{ steps.version.outputs.package_tag }}
      release_tag: ${{ steps.version.outputs.package_tag }}
      main_sha: ${{ steps.source_refs.outputs.main_sha }}
      development_sha: ${{ steps.source_refs.outputs.development_sha }}
      integration_sha: ${{ steps.integration.outputs.integration_sha }}
    steps:
      - name: Check out the nightly integration branch
        uses: actions/checkout@v4
        with:
          ref: latest/nightly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all source branches and release tags
        shell: bash
        run: git fetch origin main latest/development latest/nightly --tags

      - name: Record exact source SHAs
        id: source_refs
        shell: bash
        run: |
          set -euo pipefail
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "development_sha=$(git rev-parse origin/latest/development)" >> "$GITHUB_OUTPUT"

      - name: Assemble main and latest/development into latest/nightly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C nightly-integration origin/latest/nightly
          git merge --no-edit origin/main
          git merge --no-edit origin/latest/development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare the next unique beta build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PYVERSION'
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          current = str(project["project"]["version"])
          match = re.fullmatch(r"(\d+\.\d+\.\d+)(?:-(?:beta|b)\.(\d+))?", current)
          if not match:
              raise SystemExit(f"Unsupported project version for automated beta releases: {current}")
          base = match.group(1)
          current_number = int(match.group(2) or 0)
          tag_pattern = re.compile(r"^v" + re.escape(base) + r"-beta\.(\d+)$")
          tags = subprocess.run(
              ["git", "tag", "--list", f"v{base}-beta.*"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          tagged_numbers = [int(m.group(1)) for tag in tags if (m := tag_pattern.fullmatch(tag))]
          number = max([current_number, *tagged_numbers], default=0) + 1
          version = f"{base}-beta.{number}"

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text(encoding="utf-8")
          project_section = re.compile(r"(?ms)(^\[project\]\s*\n.*?^\s*version\s*=\s*)['\"][^'\"]+['\"]")
          pyproject, count = project_section.subn(lambda m: m.group(1) + f'"{version}"', pyproject, count=1)
          if count != 1:
              raise SystemExit("Could not update [project].version in pyproject.toml")
          pyproject_path.write_text(pyproject, encoding="utf-8")

          runtime_path = Path("axiom/version.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime, count = re.subn(
              r"(?m)^(__version__\s*=\s*)['\"][^'\"]+['\"]\s*$",
              lambda m: m.group(1) + f'"{version}"', runtime, count=1,
          )
          if count != 1:
              raise SystemExit("Could not update __version__ in axiom/version.py")
          runtime_path.write_text(runtime, encoding="utf-8")

          release_workflow_path = Path(".github/workflows/release-assets.yml")
          release_workflow = release_workflow_path.read_text(encoding="utf-8")
          release_workflow, count = re.subn(
              r'(?m)^( *default: *)"v[0-9]+[.][0-9]+[.][0-9]+(?:-(?:beta|b)[.][0-9]+)?" *$',
              lambda m: m.group(1) + f'"v{version}"',
              release_workflow,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update workflow_dispatch tag default in release-assets.yml")
          release_workflow_path.write_text(release_workflow, encoding="utf-8")

          if readme_path.exists():
              readme = readme_path.read_text(encoding="utf-8")
              readme, count = re.subn(
                  r"(https://img\.shields\.io/badge/version-v)\d+\.\d+\.\d+(?:--(?:beta|b)\.\d+)?",
                  lambda m: m.group(1) + version.replace("-", "--", 1), readme, count=1,
              )
              if count:
                  readme_path.write_text(readme, encoding="utf-8")
          print(version)
          PYVERSION
          )"
          echo "package_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          git add pyproject.toml axiom/version.py README.md .github/workflows/release-assets.yml
          git commit -m "chore: prepare verified weekly build v${VERSION}"

      - name: Record integration commit
        id: integration
        shell: bash
        run: echo "integration_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python and frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          npm ci

      - name: Static release contract
        run: python scripts/release_smoke.py

      - name: Full Python test suite
        run: python -m pytest -q

      - name: ESLint
        run: npm run lint

      - name: TypeScript, production UI build, and package copy
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Full browser acceptance suite
        run: npm run e2e

      - name: Publish verified integration to latest/nightly
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/latest/nightly

  publish-release:
    name: Build all existing packages and publish verified release
    needs: integrate-and-verify
    uses: ./.github/workflows/release-assets.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.integrate-and-verify.outputs.package_tag }}
      source_ref: latest/nightly
      release_tag: ${{ needs.integrate-and-verify.outputs.release_tag }}
      main_sha: ${{ needs.integrate-and-verify.outputs.main_sha }}
      development_sha: ${{ needs.integrate-and-verify.outputs.development_sha }}
      integration_sha: ${{ needs.integrate-and-verify.outputs.integration_sha }}
      verification_summary: "Verified on the combined main + latest/development source: release smoke contract, full pytest suite, ESLint, production TypeScript/Vite build with web UI packaging, and full Playwright browser acceptance suite all passed before the release workflow was called."
,
              lambda m: m.group(1) + f'"v{version}"',
              release_workflow,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update workflow_dispatch tag default in release-assets.yml")
          release_workflow_path.write_text(release_workflow, encoding="utf-8")

          readme_path = Path("README.md")
          if readme_path.exists():
              readme = readme_path.read_text(encoding="utf-8")
              readme, count = re.subn(
                  r"(https://img\.shields\.io/badge/version-v)\d+\.\d+\.\d+(?:--(?:beta|b)\.\d+)?",
                  lambda m: m.group(1) + version.replace("-", "--", 1), readme, count=1,
              )
              if count:
                  readme_path.write_text(readme, encoding="utf-8")
          print(version)
          PYVERSION
          )"
          echo "package_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          git add pyproject.toml axiom/version.py README.md
          git commit -m "chore: prepare verified weekly build v${VERSION}"

      - name: Record integration commit
        id: integration
        shell: bash
        run: echo "integration_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Python and frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          npm ci

      - name: Static release contract
        run: python scripts/release_smoke.py

      - name: Full Python test suite
        run: python -m pytest -q

      - name: ESLint
        run: npm run lint

      - name: TypeScript, production UI build, and package copy
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Full browser acceptance suite
        run: npm run e2e

      - name: Publish verified integration to latest/nightly
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/latest/nightly

  publish-release:
    name: Build all existing packages and publish verified release
    needs: integrate-and-verify
    uses: ./.github/workflows/release-assets.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.integrate-and-verify.outputs.package_tag }}
      source_ref: latest/nightly
      release_tag: ${{ needs.integrate-and-verify.outputs.release_tag }}
      main_sha: ${{ needs.integrate-and-verify.outputs.main_sha }}
      development_sha: ${{ needs.integrate-and-verify.outputs.development_sha }}
      integration_sha: ${{ needs.integrate-and-verify.outputs.integration_sha }}
      verification_summary: "Verified on the combined main + latest/development source: release smoke contract, full pytest suite, ESLint, production TypeScript/Vite build with web UI packaging, and full Playwright browser acceptance suite all passed before the release workflow was called."
