name: AXIOM physical accelerator integration

on:
  workflow_dispatch:
    inputs:
      device:
        description: Physical accelerator on a registered self-hosted runner
        type: choice
        required: true
        options:
          - cuda
          - rocm
          - mps
          - xpu

permissions:
  contents: read

concurrency:
  group: axiom-accelerator-integration-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  cuda:
    name: Real CUDA safetensors and LoRA forward execution
    if: inputs.device == 'cuda'
    runs-on: [self-hosted, Linux, X64, axiom-cuda]
    timeout-minutes: 35
    env:
      AXIOM_ACCELERATOR_DEVICE: cuda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AXIOM and native inference dependencies
        run: python -m pip install --upgrade pip "setuptools>=84.1.0" && python -m pip install -e ".[native-inference,test]"
      - name: Require an actual CUDA device
        run: python -c "import torch; assert torch.version.cuda and torch.cuda.is_available(); print(torch.version.cuda, torch.cuda.get_device_name(0))"
      - name: Execute real native adapter forward pass
        run: python -m pytest -q tests/test_native_engine.py::test_native_lora_adapter_executes_on_configured_accelerator

  rocm:
    name: Real ROCm safetensors and LoRA forward execution
    if: inputs.device == 'rocm'
    runs-on: [self-hosted, Linux, X64, axiom-rocm]
    timeout-minutes: 35
    env:
      AXIOM_ACCELERATOR_DEVICE: rocm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AXIOM and ROCm-enabled native inference dependencies
        run: python -m pip install --upgrade pip "setuptools>=84.1.0" && python -m pip install -e ".[native-inference,test]"
      - name: Require an actual ROCm device
        run: python -c "import torch; assert getattr(torch.version, 'hip', None) and torch.cuda.is_available(); print(torch.version.hip, torch.cuda.get_device_name(0))"
      - name: Execute real native adapter forward pass
        run: python -m pytest -q tests/test_native_engine.py::test_native_lora_adapter_executes_on_configured_accelerator

  mps:
    name: Real Apple MPS safetensors and LoRA forward execution
    if: inputs.device == 'mps'
    runs-on: [self-hosted, macOS, ARM64, axiom-mps]
    timeout-minutes: 35
    env:
      AXIOM_ACCELERATOR_DEVICE: mps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AXIOM and native inference dependencies
        run: python -m pip install --upgrade pip "setuptools>=84.1.0" && python -m pip install -e ".[native-inference,test]"
      - name: Require a Metal-capable Apple GPU
        run: python -c "import torch; assert torch.backends.mps.is_built() and torch.backends.mps.is_available(); print(torch.__version__, torch.backends.mps.is_available())"
      - name: Execute real native adapter forward pass
        run: python -m pytest -q tests/test_native_engine.py::test_native_lora_adapter_executes_on_configured_accelerator

  xpu:
    name: Real Intel XPU safetensors and LoRA forward execution
    if: inputs.device == 'xpu'
    runs-on: [self-hosted, Linux, X64, axiom-xpu]
    timeout-minutes: 35
    env:
      AXIOM_ACCELERATOR_DEVICE: xpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AXIOM and Intel XPU-enabled native inference dependencies
        run: python -m pip install --upgrade pip "setuptools>=84.1.0" && python -m pip install -e ".[native-inference,test]"
      - name: Require an actual Intel XPU device
        run: python -c "import torch; assert getattr(torch, 'xpu', None) is not None and torch.xpu.is_available(); print(torch.__version__, torch.xpu.get_device_name(0))"
      - name: Execute real native adapter forward pass
        run: python -m pytest -q tests/test_native_engine.py::test_native_lora_adapter_executes_on_configured_accelerator
