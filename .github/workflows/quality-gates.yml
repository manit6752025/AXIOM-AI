name: AXIOM quality gates

# Keep only the newest push per branch in the expensive test/build/browser gate.
concurrency:
  group: axiom-quality-gates-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "latest/development", "latest/nightly", "implement/roadmap"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-smoke:
    name: Static release contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release contract and GUI/API wiring
        run: python scripts/release_smoke.py
      - name: Compile Python source
        run: python -m compileall -q axiom scripts
      - name: Check cross-platform runtime compatibility
        run: python scripts/check_compatibility.py --json

      - name: Install cross-platform security test dependency
        run: python -m pip install pytest
      - name: Run path, artifact, and security-journal regression tests
        run: python -m pytest -q tests/test_path_safety.py tests/test_artifact_security.py tests/test_security_events.py

  full-validation:
    name: Python, lint, production build and browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python package and test dependencies
        run: python -m pip install -e '.[test,native-inference]'
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Python, Node and OS compatibility
        run: python scripts/check_compatibility.py --json --require-node
      - name: Static acceptance checks
        run: python scripts/release_smoke.py
      - name: Python tests
        run: python -m pytest -q
      - name: ESLint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run e2e
