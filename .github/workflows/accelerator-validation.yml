name: AXIOM real accelerator validation

on:
  workflow_dispatch:
    inputs:
      device:
        description: Physical accelerator backend to test
        required: true
        type: choice
        options:
          - cuda
          - rocm
          - mps
          - xpu
        default: cuda
      runner_labels:
        description: JSON array of labels for the provisioned hardware runner
        required: true
        type: string
        default: '["self-hosted","linux","x64","axiom-cuda"]'

permissions:
  contents: read

concurrency:
  group: axiom-accelerator-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  execute-real-adapter:
    name: Execute real LoRA adapter on ${{ inputs.device }}
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 30
    env:
      AXIOM_ACCELERATOR_DEVICE: ${{ inputs.device }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement/roadmap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AXIOM test dependencies without replacing the hardware PyTorch build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "safetensors>=0.4"
      - name: Verify physical device and accelerator-enabled PyTorch
        run: |
          python - <<'PY'
          import os
          import torch

          device = os.environ["AXIOM_ACCELERATOR_DEVICE"]
          if device == "cuda":
              assert torch.version.cuda is not None and torch.cuda.is_available()
          elif device == "rocm":
              assert getattr(torch.version, "hip", None) and torch.cuda.is_available()
          elif device == "mps":
              assert torch.backends.mps.is_built() and torch.backends.mps.is_available()
          elif device == "xpu":
              assert getattr(torch, "xpu", None) is not None and torch.xpu.is_available()
          else:
              raise AssertionError(f"Unsupported accelerator: {device}")
          print({
              "device": device,
              "torch": torch.__version__,
              "cuda": torch.version.cuda,
              "hip": getattr(torch.version, "hip", None),
              "device_name": (
                  torch.cuda.get_device_name(0) if device in {"cuda", "rocm"}
                  else "MPS" if device == "mps"
                  else torch.xpu.get_device_name(0)
              ),
          })
          PY
      - name: Run real checkpoint and LoRA adapter forward pass
        run: python -m pytest -q tests/test_native_engine.py::test_native_lora_adapter_executes_on_configured_accelerator
