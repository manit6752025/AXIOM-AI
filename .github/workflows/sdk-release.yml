name: Publish AXIOM SDK packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish after validation
        required: true
        type: choice
        options:
          - both
          - python
          - typescript
        default: both

permissions:
  contents: read

concurrency:
  group: axiom-sdk-publish-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate SDKs and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"
          npm install --prefix sdk/typescript --no-audit --no-fund
      - name: Verify API contract and Python SDK tests
        run: |
          python scripts/verify_sdk_contract.py --json
          python -m pytest -q tests/test_sdk_contract.py tests/test_sdk_python.py
      - name: Build Python SDK
        if: inputs.package == 'both' || inputs.package == 'python'
        run: python -m build sdk/python --sdist --wheel --outdir dist/python
      - name: Build and test TypeScript SDK
        if: inputs.package == 'both' || inputs.package == 'typescript'
        run: |
          npm test --prefix sdk/typescript
          mkdir -p dist/typescript
          npm pack --prefix sdk/typescript --pack-destination dist/typescript
      - uses: actions/upload-artifact@v7
        with:
          name: axiom-sdk-release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-python:
    name: Publish Python package to PyPI
    if: inputs.package == 'both' || inputs.package == 'python'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/axiom-ai-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: axiom-sdk-release-artifacts
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python

  publish-typescript:
    name: Publish TypeScript package to npm
    if: inputs.package == 'both' || inputs.package == 'typescript'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@axiom-ai/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: axiom-sdk-release-artifacts
          path: dist
      - name: Publish package with provenance
        run: npm publish dist/typescript/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


  verify-python-install:
    name: Install the published Python SDK from PyPI
    needs: publish-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the published wheel into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/axiom-python-sdk-verify"
          source "$RUNNER_TEMP/axiom-python-sdk-verify/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "axiom-ai-sdk==1.0.0"
          python - <<'PY'
          from importlib.metadata import version
          from axiom_sdk import AxiomClient, API_CONTRACT_VERSION

          assert version("axiom-ai-sdk") == "1.0.0"
          assert API_CONTRACT_VERSION == 1
          assert callable(AxiomClient)
          print("Published Python SDK installed and imported successfully.")
          PY

  verify-typescript-install:
    name: Install the published TypeScript SDK from npm
    needs: publish-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the published package into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/axiom-typescript-sdk-verify"
          npm install --prefix "$RUNNER_TEMP/axiom-typescript-sdk-verify" --ignore-scripts --no-audit --no-fund "@axiom-ai/sdk@1.0.0"
          cd "$RUNNER_TEMP/axiom-typescript-sdk-verify"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { AxiomClient, API_CONTRACT_VERSION } from "@axiom-ai/sdk";
            assert.equal(API_CONTRACT_VERSION, 1);
            assert.equal(typeof AxiomClient, "function");
            const client = new AxiomClient();
            client.close();
            console.log("Published TypeScript SDK installed and imported successfully.");
          '
