name: Publish npm launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish npm package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packaging/npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm publishing secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.Publish_NPM }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Publish_NPM is missing or unavailable."
            exit 1
          fi

          echo "Publishing secret is available."

      - name: Normalize and validate package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail

          npm pkg set \
            repository.url="git+https://github.com/NetCore-Technologies/AXIOM-AI.git"

          node --check bin/axiom.mjs

          node --input-type=module <<'JS'
          import fs from "node:fs";

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (pkg.name !== "@netcore-technologies/axiom-cli") {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
            throw new Error(`Invalid package version: ${pkg.version}`);
          }

          if (pkg.private === true) {
            throw new Error("The package is marked private.");
          }

          if (!pkg.bin?.axiom || !fs.existsSync(pkg.bin.axiom)) {
            throw new Error("The axiom executable is missing.");
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${pkg.version}\nname=${pkg.name}\n`
          );

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          console.log(`Executable: ${pkg.bin.axiom}`);
          JS

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $TAG_VERSION does not match package version $PACKAGE_VERSION."
            exit 1
          fi

          echo "Release tag matches package version."

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.Publish_NPM }}
        shell: bash
        run: |
          set -euo pipefail
          npm whoami --registry="https://registry.npmjs.org/"

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Check whether this version is already published
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
            --registry="https://registry.npmjs.org/" \
            >/tmp/npm-view.out 2>/tmp/npm-view.err; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; immutable versions cannot be republished, so publishing will be skipped."
          elif grep -Eq 'E404|404 Not Found|is not in this registry' /tmp/npm-view.err; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version is not present on npm; it can be published."
          else
            cat /tmp/npm-view.err >&2
            echo "::error::Could not determine whether the package version exists on npm."
            exit 1
          fi

      - name: Publish package
        if: steps.registry.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.Publish_NPM }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            PRERELEASE="${PACKAGE_VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          else
            DIST_TAG="latest"
          fi

          echo "Version: $PACKAGE_VERSION"
          echo "Distribution tag: $DIST_TAG"

          npm publish \
            --access public \
            --tag "$DIST_TAG" \
            --registry="https://registry.npmjs.org/"
