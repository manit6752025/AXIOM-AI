name: Deploy AXIOM website and signed APT repository

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to APT (leave blank to use the latest GitHub Release)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}

      - name: Set up GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh --version

      - name: Assemble website and signed APT repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$APT_SIGNING_KEY" || { echo "Missing APT_SIGNING_KEY in the github-pages environment." >&2; exit 1; }
          command -v gh >/dev/null
          command -v dpkg-deb >/dev/null

          if [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            # gh release view without a tag may fail when the latest release is a prerelease.
            # List published releases explicitly so beta releases are eligible as well.
            RELEASE_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft,publishedAt \
              --jq '[.[] | select(.isDraft == false and .publishedAt != null)] | sort_by(.publishedAt) | last | .tagName // empty')"
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "No published GitHub Releases found. Publish a release first or supply release_tag." >&2
              exit 1
            fi
          fi

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1;
          }
          echo "Publishing APT packages from release: $RELEASE_TAG"

          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          RELEASE_DIR="$RUNNER_TEMP/axiom-release-assets"
          mkdir -p "$RELEASE_DIR"
          debs=()
          # Release-assets workflow may finish after this tag-triggered workflow starts.
          # Retry while the release workflow uploads the .deb asset.
          for attempt in $(seq 1 60); do
            find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.deb' -delete
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --dir "$RELEASE_DIR" --pattern '*.deb'; then
              mapfile -t debs < <(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.deb' -print | sort)
              ((${#debs[@]} > 0)) && break
            fi
            echo "No downloadable .deb asset for $RELEASE_TAG yet (attempt $attempt/60); retrying in 10 seconds..."
            sleep 10
          done
          ((${#debs[@]} > 0)) || { echo "No .deb assets found for release $RELEASE_TAG." >&2; exit 1; }

          valid_debs=()
          for deb in "${debs[@]}"; do
            package="$(dpkg-deb -f "$deb" Package)"
            architecture="$(dpkg-deb -f "$deb" Architecture)"
            printf 'Release asset: %s | Package=%s | Architecture=%s\n' "$(basename "$deb")" "$package" "$architecture"
            if [[ "$package" == "axiom-ai" && "$architecture" == "amd64" ]]; then
              valid_debs+=("$deb")
            fi
          done
          ((${#valid_debs[@]} > 0)) || {
            echo "No release .deb has Package: axiom-ai and Architecture: amd64." >&2
            echo "Inspect the tag's build output; this workflow will not publish a wrongly named or wrong-architecture package." >&2
            exit 1
          }

          SITE_DIR="$GITHUB_WORKSPACE/_site"
          APT_DIR="$SITE_DIR/apt"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR" "$APT_DIR/pool/main" \
            "$APT_DIR/dists/stable/main/binary-amd64"
          test -f website/index.html || { echo "website/index.html is missing." >&2; exit 1; }
          cp -a website/. "$SITE_DIR/"
          touch "$SITE_DIR/.nojekyll"
          cp "${valid_debs[@]}" "$APT_DIR/pool/main/"

          # Do not pass --arch: it can filter out this repository's package.
          # Run from APT_DIR so package filenames are relative URLs under /apt/.
          (
            cd "$APT_DIR"
            dpkg-scanpackages pool/main /dev/null \
              > dists/stable/main/binary-amd64/Packages
          )
          test -s "$APT_DIR/dists/stable/main/binary-amd64/Packages" || {
            echo "APT Packages index is empty; refusing to publish." >&2; exit 1;
          }
          grep -Eq '^Package: axiom-ai$' "$APT_DIR/dists/stable/main/binary-amd64/Packages" || {
            echo "APT index does not contain Package: axiom-ai." >&2; exit 1;
          }
          grep -Eq '^Architecture: amd64$' "$APT_DIR/dists/stable/main/binary-amd64/Packages" || {
            echo "APT index does not contain Architecture: amd64." >&2; exit 1;
          }
          gzip -9n -c "$APT_DIR/dists/stable/main/binary-amd64/Packages" \
            > "$APT_DIR/dists/stable/main/binary-amd64/Packages.gz"

          GNUPGHOME="$RUNNER_TEMP/axiom-apt-gnupg"
          export GNUPGHOME
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "$FINGERPRINT" ]] || { echo "Could not identify the imported APT signing key." >&2; exit 1; }
          gpg --batch --export "$FINGERPRINT" > "$APT_DIR/axiom-archive-keyring.gpg"
          test -s "$APT_DIR/axiom-archive-keyring.gpg"

          RELEASE_FILE="$APT_DIR/dists/stable/Release"
          cat > "$RUNNER_TEMP/apt-release.conf" <<'APTCONF'
          APT::FTPArchive::Release {
            Origin "NetCore Technologies";
            Label "AXIOM";
            Suite "stable";
            Codename "stable";
            Architectures "amd64";
            Components "main";
            Description "AXIOM AI engineering platform packages";
          };
          APTCONF
          apt-ftparchive -c "$RUNNER_TEMP/apt-release.conf" release "$APT_DIR/dists/stable" > "$RELEASE_FILE"
          gpg --batch --yes --local-user "$FINGERPRINT" --clearsign \
            --output "$APT_DIR/dists/stable/InRelease" "$RELEASE_FILE"
          gpg --batch --yes --local-user "$FINGERPRINT" --armor --detach-sign \
            --output "$APT_DIR/dists/stable/Release.gpg" "$RELEASE_FILE"

          echo "===== DEPLOYMENT TREE ====="
          find "$SITE_DIR" -maxdepth 5 -type f | sort | head -150
          echo "===== APT PACKAGE INDEX VALIDATION ====="
          grep -E '^(Package|Version|Architecture|Filename):' \
            "$APT_DIR/dists/stable/main/binary-amd64/Packages"
          test -s "$APT_DIR/dists/stable/InRelease"
          test -s "$APT_DIR/dists/stable/Release.gpg"
          echo "Website and signed APT repository assembled successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy combined website and APT repository
        id: deployment
        uses: actions/deploy-pages@v4
