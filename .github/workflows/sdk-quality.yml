name: AXIOM SDK quality

on:
  push:
    branches: [main, "latest/development", "implement/roadmap"]
    paths:
      - "sdk/**"
      - "scripts/verify_sdk_contract.py"
      - "tests/test_sdk_*.py"
      - "axiom/api/**"
      - "axiom/core/**"
      - ".github/workflows/sdk-quality.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "scripts/verify_sdk_contract.py"
      - "tests/test_sdk_*.py"
      - "axiom/api/**"
      - "axiom/core/**"
      - ".github/workflows/sdk-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-sdk-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-sdk:
    name: Python SDK (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install AXIOM test dependencies and SDK builder
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"
      - name: Verify SDK methods against live OpenAPI
        run: python scripts/verify_sdk_contract.py --json
      - name: Run Python SDK and API contract regressions
        run: python -m pytest -q tests/test_sdk_contract.py tests/test_sdk_python.py
      - name: Build Python SDK wheel and source archive
        run: python -m build sdk/python --sdist --wheel --outdir dist/python
      - name: Verify wheel contents and importability
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist/python/*.whl
          python -c "from axiom_sdk import AxiomClient, API_CONTRACT_VERSION; assert API_CONTRACT_VERSION == 1; print(AxiomClient.__name__)"

  typescript-sdk:
    name: TypeScript SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install SDK development dependencies
        run: npm install --prefix sdk/typescript --no-audit --no-fund
      - name: Compile declarations and run SDK contract tests
        run: npm test --prefix sdk/typescript
      - name: Verify publishable npm archive
        run: npm pack --prefix sdk/typescript --dry-run
      - name: Install packed SDK in a clean project
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/axiom-sdk-npm-check"
          mkdir -p "$package_dir"
          npm pack --prefix sdk/typescript --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$package_dir" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/axiom-ai-sdk-1.0.0.tgz"
          cd "$package_dir"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { AxiomClient, API_CONTRACT_VERSION } from "@axiom-ai/sdk";
            assert.equal(API_CONTRACT_VERSION, 1);
            const client = new AxiomClient();
            client.close();
            console.log("Packed TypeScript SDK installed and imported from a clean project.");
          '

  contract:
    name: Shared SDK API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Verify operation registry and run contract regression
        run: |
          python scripts/verify_sdk_contract.py --json
          python -m pytest -q tests/test_sdk_contract.py
