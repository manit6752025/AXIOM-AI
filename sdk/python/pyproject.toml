[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-ai-sdk"
version = "1.0.0"
description = "Typed Python client for the versioned AXIOM local API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["axiom", "ai", "sdk", "local-first", "api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/manit6752025/AXIOM-AI"
Repository = "https://github.com/manit6752025/AXIOM-AI"
Documentation = "https://github.com/manit6752025/AXIOM-AI/tree/implement/roadmap/sdk/python"
Issues = "https://github.com/manit6752025/AXIOM-AI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom_sdk*"]

[tool.setuptools.package-data]
axiom_sdk = ["py.typed"]
