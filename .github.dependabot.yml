version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily" # Checks daily for latest versions & security patches
    versioning-strategy: increase # Always bumps package.json to the newest version
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*" # Groups all updates into one clean PR instead of spamming you
