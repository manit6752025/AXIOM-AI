<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">AXIOM terminal demo</title><desc id="d">axiom doctor, axiom system info and axiom train plan run in a terminal.</desc>
<defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"Ubuntu Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.b{font-weight:700}.u{text-transform:uppercase;letter-spacing:1.6px}
.ln{animation:sh .01s both}@keyframes sh{from{opacity:0}to{opacity:1}}.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
</style></defs>
<rect width="960" height="470" fill="#111111"/><rect x="0.5" y="0.5" width="959" height="469" fill="none" stroke="#2a2a2a"/>
<rect x="0" y="0" width="960" height="40" fill="#0c0c0c"/><rect x="0" y="40" width="960" height="1" fill="#2a2a2a"/>
<rect x="16" y="12" width="16" height="16" fill="#d9f542"/><path d="M19 25L24 15L29 25M20.5 22.5H27.5" stroke="#111" stroke-width="1.8" fill="none"/>
<text x="42" y="25" class="s b u" font-size="11" fill="#f2f2f2" style="letter-spacing:2px">AXIOM</text><text x="104" y="25" class="s" font-size="12" fill="#8c8c8c">›  terminal  ~/my-ai</text>
<rect x="826" y="10" width="70" height="20" fill="#d9f542" fill-opacity="0.08" stroke="#d9f542"/><text x="835" y="24" class="s b u" font-size="10.5" fill="#d9f542" style="letter-spacing:1.2px">• LOCAL</text>
<text xml:space="preserve" class="m ln" x="36" y="76" font-size="15" style="animation-delay:0.90s"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom doctor</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="100" font-size="15" style="animation-delay:1.18s"><tspan fill="#a3e635">  [ OK ] </tspan><tspan fill="#f2f2f2">Python 3.12</tspan><tspan fill="#8c8c8c">                    pass</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="124" font-size="15" style="animation-delay:1.46s"><tspan fill="#a3e635">  [ OK ] </tspan><tspan fill="#f2f2f2">Workspace layout</tspan><tspan fill="#8c8c8c">               pass</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="148" font-size="15" style="animation-delay:1.74s"><tspan fill="#f5a623">  [WARN] </tspan><tspan fill="#f2f2f2">GPU / CUDA</tspan><tspan fill="#f5a623">                     warn</tspan><tspan fill="#8c8c8c">  CPU only</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="172" font-size="15" style="animation-delay:2.02s"><tspan fill="#f5a623">  [WARN] </tspan><tspan fill="#f2f2f2">Ollama service</tspan><tspan fill="#f5a623">                 warn</tspan><tspan fill="#8c8c8c">  axiom infer service start</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="210" font-size="15" style="animation-delay:2.92s"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom system info</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="234" font-size="15" style="animation-delay:3.20s"><tspan fill="#8c8c8c">  CPU    </tspan><tspan fill="#f2f2f2">4 cores</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="258" font-size="15" style="animation-delay:3.48s"><tspan fill="#8c8c8c">  RAM    </tspan><tspan fill="#f2f2f2">7.7 GB</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="282" font-size="15" style="animation-delay:3.76s"><tspan fill="#8c8c8c">  GPU    </tspan><tspan fill="#f2f2f2">none detected</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="306" font-size="15" style="animation-delay:4.04s"><tspan fill="#8c8c8c">  Fits   </tspan><tspan fill="#f2f2f2">1B </tspan><tspan fill="#a3e635">ok</tspan><tspan fill="#f2f2f2">   3B QLoRA </tspan><tspan fill="#a3e635">ok</tspan><tspan fill="#f2f2f2">   7B QLoRA </tspan><tspan fill="#f87171">no</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="344" font-size="15" style="animation-delay:4.94s"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom train plan 7 --method qlora</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="368" font-size="15" style="animation-delay:5.22s"><tspan fill="#8c8c8c">  est. memory  </tspan><tspan fill="#f2f2f2">~9.4 GB needed</tspan><tspan fill="#8c8c8c">   you have </tspan><tspan fill="#f2f2f2">7.7 GB</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="392" font-size="15" style="animation-delay:5.50s"><tspan fill="#8c8c8c">  verdict      </tspan><tspan fill="#f87171">does not fit</tspan><tspan fill="#8c8c8c">   try 3B or a smaller context</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="416" font-size="15" style="animation-delay:5.78s"><tspan fill="#8c8c8c">  Planning only. No job was started.</tspan></text>
<text xml:space="preserve" class="m ln" x="36" y="450" font-size="15" style="animation-delay:6.38s"><tspan fill="#d9f542">$ </tspan></text><rect class="cur ln" x="54" y="436" width="9" height="17" fill="#d9f542" style="animation-delay:6.38s"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>