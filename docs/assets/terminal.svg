<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">AXIOM terminal demo</title><desc id="d">Real output of axiom doctor, axiom system info and axiom train plan.</desc>
<defs><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"Ubuntu Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}.b{font-weight:700}
.ln{animation:sh .01s both}@keyframes sh{from{opacity:0}to{opacity:1}}.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style></defs>
<rect width="960" height="668" fill="#111111"/><rect x="0.5" y="0.5" width="959" height="667" fill="none" stroke="#2a2a2a"/>
<rect width="960" height="40" fill="#0c0c0c"/><rect y="40" width="960" height="1" fill="#2a2a2a"/>
<rect x="16" y="12" width="16" height="16" fill="#d9f542"/><path d="M19 25L24 15L29 25M20.5 22.5H27.5" stroke="#111" stroke-width="1.8" fill="none"/>
<text x="42" y="25" class="s b" font-size="11" fill="#f2f2f2" style="letter-spacing:2px">AXIOM</text><text x="104" y="25" class="s" font-size="12" fill="#8c8c8c">›  terminal  ~/Documents/AXIOM-AI</text>
<rect x="826" y="10" width="72" height="20" fill="#d9f542" fill-opacity="0.08" stroke="#d9f542"/><text x="835" y="24" class="s b" font-size="10.5" fill="#d9f542" style="letter-spacing:1.2px">• LOCAL</text>
<text xml:space="preserve" class="m ln" x="30" y="72" font-size="13.5" style="animation-delay:0.80s"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom doctor</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="92" font-size="13.5" style="animation-delay:0.98s"><tspan fill="#d9f542">AXIOM Doctor — 0.3.0-beta.8</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="112" font-size="13.5" style="animation-delay:1.16s"><tspan fill="#8c8c8c">Workspace: AXIOM-AI</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="132" font-size="13.5" style="animation-delay:1.34s"><tspan fill="#a3e635">[OK  ] </tspan><tspan fill="#f2f2f2">Workspace directory: </tspan><tspan fill="#8c8c8c">A readable local workspace directory was resolved.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="152" font-size="13.5" style="animation-delay:1.52s"><tspan fill="#f5a623">[WARN] </tspan><tspan fill="#f2f2f2">Project configuration: </tspan><tspan fill="#8c8c8c">No axiom.yaml file was found in the resolved workspace.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="172" font-size="13.5" style="animation-delay:1.70s"><tspan fill="#8c8c8c">       Next: Run `axiom init my-ai` for a new project, or choose the intended workspace.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="192" font-size="13.5" style="animation-delay:1.88s"><tspan fill="#8c8c8c">[INFO] </tspan><tspan fill="#f2f2f2">data/ directory: </tspan><tspan fill="#8c8c8c">The optional data/ directory is not present in this workspace.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="212" font-size="13.5" style="animation-delay:2.06s"><tspan fill="#a3e635">[OK  ] </tspan><tspan fill="#f2f2f2">Free disk space: </tspan><tspan fill="#8c8c8c">At least 1 GiB of free disk space is available.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="232" font-size="13.5" style="animation-delay:2.24s"><tspan fill="#a3e635">[OK  ] </tspan><tspan fill="#f2f2f2">Python version: </tspan><tspan fill="#8c8c8c">Python 3.12.3 is supported.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="252" font-size="13.5" style="animation-delay:2.42s"><tspan fill="#a3e635">[OK  ] </tspan><tspan fill="#f2f2f2">Dependency: mcp: </tspan><tspan fill="#8c8c8c">mcp 2.3.0 is importable and meets the supported minimum 2.0.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="272" font-size="13.5" style="animation-delay:2.60s"><tspan fill="#f2f2f2">Doctor complete: </tspan><tspan fill="#a3e635">15 passed</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f5a623">1 warning(s)</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">0 failed</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="302" font-size="13.5" style="animation-delay:3.40s"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom system info</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="322" font-size="13.5" style="animation-delay:3.58s"><tspan fill="#8c8c8c">╭──────────── </tspan><tspan fill="#d9f542">AXIOM</tspan><tspan fill="#8c8c8c"> ────────────╮</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="342" font-size="13.5" style="animation-delay:3.76s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">AXIOM HARDWARE</tspan><tspan fill="#8c8c8c">                │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="362" font-size="13.5" style="animation-delay:3.94s"><tspan fill="#8c8c8c">│                               │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="382" font-size="13.5" style="animation-delay:4.12s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">OS:              Linux</tspan><tspan fill="#8c8c8c">        │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="402" font-size="13.5" style="animation-delay:4.30s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">Architecture:    x86_64</tspan><tspan fill="#8c8c8c">       │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="422" font-size="13.5" style="animation-delay:4.48s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">CPU cores:       4</tspan><tspan fill="#8c8c8c">            │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="442" font-size="13.5" style="animation-delay:4.66s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">RAM:             7.65 GB</tspan><tspan fill="#8c8c8c">      │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="462" font-size="13.5" style="animation-delay:4.84s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">GPU:             Not detected</tspan><tspan fill="#8c8c8c"> │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="482" font-size="13.5" style="animation-delay:5.02s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">VRAM:            N/A</tspan><tspan fill="#8c8c8c">          │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="502" font-size="13.5" style="animation-delay:5.20s"><tspan fill="#8c8c8c">│ </tspan><tspan fill="#f2f2f2">CUDA available:  </tspan><tspan fill="#f87171">✗</tspan><tspan fill="#8c8c8c">            │</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="522" font-size="13.5" style="animation-delay:5.38s"><tspan fill="#8c8c8c">╰───────────────────────────────╯</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="552" font-size="13.5" style="animation-delay:6.18s"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom train plan 7 --method qlora</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="572" font-size="13.5" style="animation-delay:6.36s"><tspan fill="#8c8c8c">  est. memory  </tspan><tspan fill="#f2f2f2">~9.4 GB needed</tspan><tspan fill="#8c8c8c">   you have </tspan><tspan fill="#f2f2f2">7.65 GB</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="592" font-size="13.5" style="animation-delay:6.54s"><tspan fill="#8c8c8c">  verdict      </tspan><tspan fill="#f87171">does not fit</tspan><tspan fill="#8c8c8c">   try 3B or a smaller context</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="612" font-size="13.5" style="animation-delay:6.72s"><tspan fill="#8c8c8c">  Planning only. No job was started.</tspan></text>
<text xml:space="preserve" class="m ln" x="30" y="636" font-size="13.5" style="animation-delay:7.22s"><tspan fill="#d9f542">$ </tspan></text><rect class="cur ln" x="46" y="623" width="8" height="16" fill="#d9f542" style="animation-delay:7.22s"/>
