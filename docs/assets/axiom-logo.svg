<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="60%" stop-color="#070910"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>

    <!-- Cyan glow for icon -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- Center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- Left glow -->
    <radialGradient id="leftGlow" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur filter -->
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="iconBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>

    <!-- Fine grid -->
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.025"/>
    </pattern>

    <!-- Clip for logo mark -->
    <clipPath id="hexClip">
      <polygon points="640,160 746,220 746,340 640,400 534,340 534,220"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <ellipse cx="640" cy="320" rx="500" ry="280" fill="url(#centerGlow)" filter="url(#softBlur)"/>
  <ellipse cx="340" cy="320" rx="340" ry="240" fill="url(#leftGlow)" filter="url(#softBlur)"/>

  <!-- ── BORDER LINES ── -->
  <!-- Top -->
  <rect x="0" y="0" width="1280" height="1.5" fill="#0ea5e9" fill-opacity="0.5"/>
  <!-- Bottom -->
  <rect x="0" y="638.5" width="1280" height="1.5" fill="#0ea5e9" fill-opacity="0.25"/>
  <!-- Left -->
  <rect x="0" y="0" width="1" height="640" fill="#0ea5e9" fill-opacity="0.2"/>
  <!-- Right -->
  <rect x="1279" y="0" width="1" height="640" fill="#0ea5e9" fill-opacity="0.2"/>

  <!-- ── CORNER BRACKETS ── -->
  <!-- Top-left -->
  <rect x="40" y="40" width="2" height="80" fill="#0ea5e9" fill-opacity="0.45"/>
  <rect x="40" y="40" width="80" height="2" fill="#0ea5e9" fill-opacity="0.45"/>
  <circle cx="40" cy="40" r="3" fill="#0ea5e9" fill-opacity="0.7"/>

  <!-- Top-right -->
  <rect x="1238" y="40" width="2" height="80" fill="#0ea5e9" fill-opacity="0.45"/>
  <rect x="1160" y="40" width="80" height="2" fill="#0ea5e9" fill-opacity="0.45"/>
  <circle cx="1240" cy="40" r="3" fill="#0ea5e9" fill-opacity="0.7"/>

  <!-- Bottom-left -->
  <rect x="40" y="520" width="2" height="80" fill="#0ea5e9" fill-opacity="0.45"/>
  <rect x="40" y="598" width="80" height="2" fill="#0ea5e9" fill-opacity="0.45"/>
  <circle cx="40" cy="600" r="3" fill="#0ea5e9" fill-opacity="0.7"/>

  <!-- Bottom-right -->
  <rect x="1238" y="520" width="2" height="80" fill="#0ea5e9" fill-opacity="0.45"/>
  <rect x="1160" y="598" width="80" height="2" fill="#0ea5e9" fill-opacity="0.45"/>
  <circle cx="1240" cy="600" r="3" fill="#0ea5e9" fill-opacity="0.7"/>

  <!-- ── GEOMETRIC ICON MARK ── -->
  <!-- Outer glow -->
  <circle cx="340" cy="320" r="140" fill="url(#iconGlow)" filter="url(#iconBlur)"/>

  <!-- Outer hexagon -->
  <polygon points="340,180 436,234 436,342 340,396 244,342 244,234"
           fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Mid hexagon -->
  <polygon points="340,212 410,253 410,335 340,376 270,335 270,253"
           fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Inner hexagon filled glass -->
  <polygon points="340,240 394,271 394,333 340,364 286,333 286,271"
           fill="#0ea5e9" fill-opacity="0.04"/>
  <polygon points="340,240 394,271 394,333 340,364 286,333 286,271"
           fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Geometric A inside hexagon -->
  <!-- Left leg -->
  <line x1="310" y1="350" x2="340" y2="258" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Right leg -->
  <line x1="340" y1="258" x2="370" y2="350" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Crossbar -->
  <line x1="318" y1="318" x2="362" y2="318" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Apex dot -->
  <circle cx="340" cy="256" r="4" fill="#0ea5e9"/>
  <!-- Crossbar endpoint dots -->
  <circle cx="318" cy="318" r="2.5" fill="#0ea5e9" fill-opacity="0.7"/>
  <circle cx="362" cy="318" r="2.5" fill="#0ea5e9" fill-opacity="0.7"/>

  <!-- Connector spokes (hex to center lines) -->
  <line x1="340" y1="180" x2="340" y2="240" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3,4"/>
  <line x1="436" y1="234" x2="394" y2="271" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3,4"/>
  <line x1="436" y1="342" x2="394" y2="333" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3,4"/>
  <line x1="340" y1="396" x2="340" y2="364" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3,4"/>
  <line x1="244" y1="342" x2="286" y2="333" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3,4"/>
  <line x1="244" y1="234" x2="286" y2="271" stroke="#0ea5e9" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3,4"/>

  <!-- Hex vertex dots -->
  <circle cx="340" cy="180" r="2.5" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="436" cy="234" r="2.5" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="436" cy="342" r="2.5" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="340" cy="396" r="2.5" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="244" cy="342" r="2.5" fill="#0ea5e9" fill-opacity="0.5"/>
  <circle cx="244" cy="234" r="2.5" fill="#0ea5e9" fill-opacity="0.5"/>

  <!-- ── DIVIDER LINE ── -->
  <line x1="510" y1="180" x2="510" y2="460" stroke="#1e293b" stroke-width="1"/>
  <line x1="510" y1="180" x2="510" y2="460" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- ── TEXT BLOCK ── -->

  <!-- Eyebrow label -->
  <rect x="560" y="154" width="210" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.08"/>
  <rect x="560" y="154" width="210" height="24" rx="12" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.35"/>
  <circle cx="576" cy="166" r="3.5" fill="#22c55e"/>
  <text x="588" y="170"
        font-family="'SF Mono','Fira Code','Cascadia Code',monospace"
        font-size="10" fill="#64748b" letter-spacing="2">ACTIVE DEVELOPMENT</text>

  <!-- AXIOM wordmark -->
  <text x="556" y="290"
        font-family="'SF Pro Display','Inter','Helvetica Neue',system-ui,sans-serif"
        font-size="108" font-weight="800" fill="white" letter-spacing="-3"
        filter="url(#subtleGlow)">AXIOM</text>

  <!-- Tagline -->
  <text x="560" y="342"
        font-family="'SF Pro Display','Inter','Helvetica Neue',system-ui,sans-serif"
        font-size="22" font-weight="300" fill="#94a3b8" letter-spacing="0.5">Build AI.  Own AI.</text>

  <!-- Divider rule -->
  <rect x="560" y="372" width="620" height="0.75" fill="#1e293b"/>

  <!-- Platform label -->
  <text x="560" y="400"
        font-family="'SF Mono','Fira Code','Cascadia Code',monospace"
        font-size="11" fill="#475569" letter-spacing="3.5">AI ENGINEERING PLATFORM</text>

  <!-- Feature pills row -->
  <!-- Models -->
  <rect x="560" y="428" width="74" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="560" y="428" width="74" height="22" rx="4" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="0.5"/>
  <text x="597" y="443" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">MODELS</text>

  <!-- Datasets -->
  <rect x="642" y="428" width="80" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="642" y="428" width="80" height="22" rx="4" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="0.5"/>
  <text x="682" y="443" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">DATASETS</text>

  <!-- Training -->
  <rect x="730" y="428" width="78" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="730" y="428" width="78" height="22" rx="4" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="0.5"/>
  <text x="769" y="443" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">TRAINING</text>

  <!-- Evaluation -->
  <rect x="816" y="428" width="92" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="816" y="428" width="92" height="22" rx="4" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="0.5"/>
  <text x="862" y="443" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">EVALUATION</text>

  <!-- Runtime -->
  <rect x="916" y="428" width="76" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="916" y="428" width="76" height="22" rx="4" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="0.5"/>
  <text x="954" y="443" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">RUNTIME</text>

  <!-- Deploy -->
  <rect x="1000" y="428" width="78" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.1"/>
  <rect x="1000" y="428" width="78" height="22" rx="4" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="0.5"/>
  <text x="1039" y="443" font-family="'SF Mono','Fira Code',monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">DEPLOY</text>

  <!-- ── BOTTOM BAR ── -->
  <rect x="40" y="572" width="1200" height="0.5" fill="#1e293b"/>

  <!-- Bottom left: version -->
  <text x="40" y="600"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="10" fill="#334155" letter-spacing="1.5">v0.2.0-beta.4</text>

  <!-- Bottom center: URL -->
  <text x="640" y="600"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="10" fill="#334155" text-anchor="middle" letter-spacing="1.5">github.com/NetCore-Technologies/AXIOM-AI</text>

  <!-- Bottom right: org -->
  <text x="1240" y="600"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="10" fill="#334155" text-anchor="end" letter-spacing="1.5">NETCORE TECHNOLOGIES</text>

  <!-- ── DECORATIVE SCAN LINE ── -->
  <rect x="0" y="319" width="1280" height="0.5" fill="#0ea5e9" fill-opacity="0.04"/>

</svg>
