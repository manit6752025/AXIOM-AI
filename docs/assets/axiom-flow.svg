<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">AXIOM workflow: inspect, validate, plan, run</title><desc id="d">Four steps AXIOM runs on your own machine before you spend GPU time: inspect, validate, plan, run.</desc>
<defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,Inter,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"Ubuntu Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.b{font-weight:700}.u{text-transform:uppercase;letter-spacing:1.6px}
.fl{stroke-dasharray:5 5;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-10}}
</style></defs>
<rect width="1200" height="360" fill="#111111"/><rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#2a2a2a"/>
<rect x="40" y="38" width="22" height="22" fill="#d9f542"/><path d="M44 56L51 42L58 56M46.5 52H55.5" stroke="#111" stroke-width="2.4" fill="none"/>
<text xml:space="preserve" x="72" y="55" class="s b u" font-size="14" fill="#f2f2f2" style="letter-spacing:3px">AXIOM</text>
<text xml:space="preserve" x="40" y="100" class="s b" font-size="30" fill="#f2f2f2" style="letter-spacing:-1px">Know what fits before you train.</text>
<rect x="956" y="40" width="188" height="20" fill="#d9f542" fill-opacity="0.08" stroke="#d9f542"/><text xml:space="preserve" x="965" y="54" class="s b u" font-size="10.5" fill="#d9f542" style="letter-spacing:1.2px">RUNS ON YOUR MACHINE</text>
<rect x="40" y="132" width="250" height="180" fill="#161616" stroke="#2a2a2a"/><rect x="40" y="132" width="250" height="3" fill="#d9f542"/>
<text xml:space="preserve" x="56" y="166" class="m b" font-size="22" fill="#d9f542">01</text><text xml:space="preserve" x="98" y="165" class="s b u" font-size="15" fill="#f2f2f2" style="letter-spacing:2px">INSPECT</text>
<text xml:space="preserve" x="56" y="190" class="s" font-size="13" fill="#8c8c8c">Models and hardware</text>
<rect x="56" y="204" width="218" height="52" fill="#0b0b0b" stroke="#2a2a2a"/>
<text xml:space="preserve" x="66" y="226" class="m" font-size="12.5"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom model inspect</tspan></text>
<text xml:space="preserve" x="66" y="245" class="m" font-size="12.5"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom system info</tspan></text>
<rect x="56" y="274" width="55" height="20" fill="#d9f542" fill-opacity="0.08" stroke="#d9f542"/><text xml:space="preserve" x="65" y="288" class="s b u" font-size="10.5" fill="#d9f542" style="letter-spacing:1.2px">LOCAL</text>
<path class="fl" d="M294 222H326" stroke="#d9f542" stroke-width="2" fill="none"/><path d="M323 216l7 6-7 6z" fill="#d9f542"/>
<rect x="330" y="132" width="250" height="180" fill="#161616" stroke="#2a2a2a"/><rect x="330" y="132" width="250" height="3" fill="#d9f542"/>
<text xml:space="preserve" x="346" y="166" class="m b" font-size="22" fill="#d9f542">02</text><text xml:space="preserve" x="388" y="165" class="s b u" font-size="15" fill="#f2f2f2" style="letter-spacing:2px">VALIDATE</text>
<text xml:space="preserve" x="346" y="190" class="s" font-size="13" fill="#8c8c8c">JSONL datasets</text>
<rect x="346" y="204" width="218" height="52" fill="#0b0b0b" stroke="#2a2a2a"/>
<text xml:space="preserve" x="356" y="226" class="m" font-size="12.5"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom dataset validate</tspan></text>
<text xml:space="preserve" x="356" y="245" class="m" font-size="12.5"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom dataset clean</tspan></text>
<rect x="346" y="274" width="173" height="20" fill="#d9f542" fill-opacity="0.08" stroke="#d9f542"/><text xml:space="preserve" x="355" y="288" class="s b u" font-size="10.5" fill="#d9f542" style="letter-spacing:1.2px">ORIGINAL UNTOUCHED</text>
<path class="fl" d="M584 222H616" stroke="#d9f542" stroke-width="2" fill="none"/><path d="M613 216l7 6-7 6z" fill="#d9f542"/>
<rect x="620" y="132" width="250" height="180" fill="#161616" stroke="#2a2a2a"/><rect x="620" y="132" width="250" height="3" fill="#f5a623"/>
<text xml:space="preserve" x="636" y="166" class="m b" font-size="22" fill="#f5a623">03</text><text xml:space="preserve" x="678" y="165" class="s b u" font-size="15" fill="#f2f2f2" style="letter-spacing:2px">PLAN</text>
<text xml:space="preserve" x="636" y="190" class="s" font-size="13" fill="#8c8c8c">Hardware-aware training</text>
<rect x="636" y="204" width="218" height="52" fill="#0b0b0b" stroke="#2a2a2a"/>
<text xml:space="preserve" x="646" y="226" class="m" font-size="12.5"><tspan fill="#f5a623">$ </tspan><tspan fill="#f2f2f2">axiom train plan 7</tspan></text>
<text xml:space="preserve" x="646" y="245" class="m" font-size="12.5"><tspan fill="#f5a623">  </tspan><tspan fill="#f2f2f2">  --method qlora</tspan></text>
<rect x="636" y="274" width="114" height="20" fill="#f5a623" fill-opacity="0.08" stroke="#f5a623"/><text xml:space="preserve" x="645" y="288" class="s b u" font-size="10.5" fill="#f5a623" style="letter-spacing:1.2px">NO JOB STARTS</text>
<path class="fl" d="M874 222H906" stroke="#d9f542" stroke-width="2" fill="none"/><path d="M903 216l7 6-7 6z" fill="#d9f542"/>
<rect x="910" y="132" width="250" height="180" fill="#161616" stroke="#2a2a2a"/><rect x="910" y="132" width="250" height="3" fill="#d9f542"/>
<text xml:space="preserve" x="926" y="166" class="m b" font-size="22" fill="#d9f542">04</text><text xml:space="preserve" x="968" y="165" class="s b u" font-size="15" fill="#f2f2f2" style="letter-spacing:2px">RUN</text>
<text xml:space="preserve" x="926" y="190" class="s" font-size="13" fill="#8c8c8c">Train and generate</text>
<rect x="926" y="204" width="218" height="52" fill="#0b0b0b" stroke="#2a2a2a"/>
<text xml:space="preserve" x="936" y="226" class="m" font-size="12.5"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom train run</tspan></text>
<text xml:space="preserve" x="936" y="245" class="m" font-size="12.5"><tspan fill="#d9f542">$ </tspan><tspan fill="#f2f2f2">axiom infer run</tspan></text>
<rect x="926" y="274" width="55" height="20" fill="#d9f542" fill-opacity="0.08" stroke="#d9f542"/><text xml:space="preserve" x="935" y="288" class="s b u" font-size="10.5" fill="#d9f542" style="letter-spacing:1.2px">LOCAL</text>
<text xml:space="preserve" x="40" y="340" class="s" font-size="12.5" fill="#8c8c8c">Local by default. Network is opt-in. MCP agents are denied every tool until you allow it.</text>
<text xml:space="preserve" x="1160" y="340" class="m" font-size="12" text-anchor="end" fill="#8c8c8c">CLI · Control Center · MCP</text>
